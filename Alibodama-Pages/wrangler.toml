# ==================================================================
#  Alibodama — Telegram WEB Proxy | Cloudflare PAGES configuration
#  Advanced mode: every request is handled by _worker.js
#  CLI deploy:   npx wrangler pages deploy
# ==================================================================

name = "alibodama"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

[vars]
# Max concurrent streams per WebSocket session (4-100000)
MAX_DIALS = "45"
# Optional camouflage: browser visitors see this URL instead of the dashboard
# CAMOUFLAGE_URL = "https://example.com"

# PROXY_SECRET (the proxy password) must be set from the Pages dashboard:
#     Pages project -> Settings -> Environment variables -> Production -> Add
# It must be exactly 32 hex characters (optionally prefixed with "dd").
